apiVersion: apps/v1
kind: Deployment
metadata:
  name: telegrambot
  labels:
    app: telegrambot
spec:
  selector:
    matchLabels:
      app: telegrambot
  replicas: 1
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: telegrambot
    spec:
      containers:
        - name: telegrambot
          image: henda24/telegrambot:1885
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "384Mi"
          env:
            - name: TZ
              value: "America/Bogota"
            # Si REDIS_URL tiene valor, usa el StatefulSet externo de Redis.
            # Si se deja vacío ("") o se elimina, el bot levanta automáticamente
            # una DB SQLite local en memoria mientras el pod viva.
            - name: REDIS_URL
              value: "redis://telegrambot-redis:6379/0"
          envFrom:
            - secretRef:
                name: telegrambot
          args: ["--token", "$(TOKEN)"]
          volumeMounts:
            - name: tz-config
              mountPath: /etc/localtime
      volumes:
        - name: tz-config
          hostPath:
            path: /etc/localtime
